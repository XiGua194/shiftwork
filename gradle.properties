# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html
# org.gradle.parallel=true

# Kotlin DSL settings
kotlin.code.style=official

# AndroidX settings
android.useAndroidX=true
android.enableJetifier=true

# KSP settings
ksp.incremental=true
ksp.incremental.interop=true

# Room schema location
room.schemaLocation=$projectDir/schemas

# Version catalog (可选，这里直接写版本)
agp.version=8.4.0
kotlin.version=1.9.22
ksp.version=1.9.20-1.0.14
hilt.version=2.48.1
room.version=2.6.1
material.version=1.11.0
lifecycle.version=2.7.0
navigation.version=2.7.6
work.version=2.9.0
datastore.version=1.0.0
glide.version=4.16.0
coroutines.version=1.7.3
threetenbp.version=1.6.8
opencsv.version=5.8
poi.version=5.2.5